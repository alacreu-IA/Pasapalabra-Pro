<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PasaPalabra PRO</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b1220" />

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: #0b1220;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */
.header {
  width: 100%;
  max-width: 420px;
  padding: 15px 20px 0;
}

.progress-bar {
  height: 6px;
  background: #1f2937;
  border-radius: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 10%;
  background: linear-gradient(90deg, #facc15, #f59e0b);
  transition: width 0.3s;
}

.progress-text {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 5px;
}

/* CARD */
.card {
  width: 92%;
  max-width: 420px;
  background: #111827;
  border-radius: 20px;
  padding: 20px;
  margin-top: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.word {
  font-size: 30px;
  font-weight: 900;
  color: #facc15;
  margin-bottom: 10px;
}

.definition {
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 15px;
}

.block {
  background: #0f172a;
  border: 1px solid #1f2937;
  border-radius: 12px;
  padding: 10px;
  margin-top: 10px;
}

.block-title {
  font-size: 11px;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}

.block-content {
  font-size: 14px;
  line-height: 1.5;
}

/* BOTONES */
.buttons {
  width: 92%;
  max-width: 420px;
  display: flex;
  justify-content: space-between;
  margin: 20px 0;
}

.btn {
  flex: 1;
  margin: 5px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.btn-red { background: #991b1b; }
.btn-yellow { background: #92400e; }
.btn-green { background: #065f46; }

.status {
  font-size: 12px;
  opacity: 0.5;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="header">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText">1 / 20</div>
</div>

<div class="card">
  <div class="word" id="word">Pulsa iniciar</div>

  <div class="definition" id="definition">
    Definición aparecerá aquí
  </div>

  <div class="block">
    <div class="block-title">Sinónimos</div>
    <div class="block-content" id="synonyms">—</div>
  </div>

  <div class="block">
    <div class="block-title">Ejemplo</div>
    <div class="block-content" id="example">—</div>
  </div>

  <div class="block">
    <div class="block-title">Etimología / Para memorizar</div>
    <div class="block-content" id="etym">—</div>
  </div>
</div>

<div class="buttons">
  <button class="btn btn-red">No la sé</button>
  <button class="btn btn-yellow">Repasar</button>
  <button class="btn btn-green">La sé</button>
</div>

<div class="status" id="status">Inicializando...</div>

<script src="db.js"></script>
<script src="vocabEngine.js"></script>

<script>
window.addEventListener("load", async function () {
  await initDB();
  await seedTestWordsIfEmpty();
  startVocabSession();
  document.getElementById("status").innerText = "Lista ✔";
});
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
