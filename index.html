<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PasaPalabra PRO</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 20px;
    }

    .controls {
      margin: 20px 0;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: #1f2937;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      min-height: 250px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .status {
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <h1>PasaPalabra PRO</h1>

  <div class="controls">
    <button onclick="startVocabSession()">Iniciar vocabulario</button>
    <button onclick="flipCard()">Girar</button>
    <button onclick="nextCard()">Siguiente</button>
  </div>

  <div class="card">
    <div id="cardFront">
      Pulsa "Iniciar vocabulario"
    </div>
    <div id="cardBack" style="display:none;"></div>
  </div>

  <div class="status" id="status">
    Base estructural lista
  </div>

  <!-- Base de datos -->
  <script src="db.js"></script>

  <!-- Motor vocabulario -->
  <script src="vocabEngine.js"></script>

  <script>
    window.addEventListener("load", async function () {
      try {
        await initDB();
        document.getElementById("status").innerText = "Base de datos lista ✔";
      } catch (error) {
        document.getElementById("status").innerText = "Error en base de datos ❌";
        console.error(error);
      }
    });
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
