<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PasaPalabra PRO</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f111a">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f111a;
  --card:#171923;
  --card2:#1f2230;
  --border:#2a2d3c;
  --text:#f0f0f5;
  --text2:#8e92a7;
  --gold:#f5c842;
  --green:#3ecf72;
  --red:#ff5555;
  --r:18px;
}

body{
  margin:0;
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* PROGRESO */
.header{
  width:100%;
  max-width:420px;
  padding:18px 20px 0;
}

.progress-bar{
  height:6px;
  background:var(--card2);
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:var(--gold);
  transition:.3s;
}

.progress-text{
  font-size:11px;
  color:var(--text2);
  margin-top:6px;
  font-family:'Syne',sans-serif;
}

/* TARJETA */
.card{
  width:92%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:22px;
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  min-height:260px;
  cursor:pointer;
  transition:.2s;
}

.card:active{ transform:scale(.98); }

.qlbl{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:var(--text2);
  font-family:'Syne',sans-serif;
}

.definition{ font-size:18px; line-height:1.6; }

.word{
  font-family:'Syne',sans-serif;
  font-size:30px;
  font-weight:800;
  color:var(--gold);
  margin-top:6px;
  display:none;
}

.block{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  display:none;
}

.block-title{
  font-size:10px;
  text-transform:uppercase;
  color:var(--text2);
  margin-bottom:6px;
  font-family:'Syne',sans-serif;
}

.block-content{ font-size:14px; line-height:1.6; }

.list{
  margin:0;
  padding-left:18px;
}
.list li{ margin:6px 0; }

/* BOTONES */
.buttons{
  width:92%;
  max-width:420px;
  display:flex;
  gap:8px;
  margin:20px 0 10px;
}

.btn{
  flex:1;
  border:none;
  border-radius:14px;
  padding:12px 6px;
  font-family:'Syne',sans-serif;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

.btn:active{ transform:scale(.96); }

.btn-red{background:rgba(255,85,85,0.15);color:var(--red);border:1px solid rgba(255,85,85,0.4);}
.btn-yellow{background:rgba(245,200,66,0.15);color:var(--gold);border:1px solid rgba(245,200,66,0.4);}
.btn-green{background:rgba(62,207,114,0.15);color:var(--green);border:1px solid rgba(62,207,114,0.4);}

.row{
  width:92%;
  max-width:420px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.status{ font-size:11px; color:var(--text2); }
.link{
  font-size:11px;
  color:var(--text2);
  text-decoration:none;
  border:1px solid var(--border);
  padding:8px 10px;
  border-radius:12px;
  display:none;
}
.link:active{ transform:scale(.98); }
</style>
</head>

<body>

<div class="header">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText">0 / 20</div>
</div>

<div class="card" onclick="revealAnswer()">

  <div class="qlbl">Definición</div>
  <div class="definition" id="definition">Cargando...</div>

  <div class="word" id="word"></div>

  <div class="block" id="sensesBlock">
    <div class="block-title">Acepciones</div>
    <div class="block-content" id="senses"></div>
  </div>

  <div class="block" id="synBlock">
    <div class="block-title">Sinónimos</div>
    <div class="block-content" id="synonyms"></div>
  </div>

  <div class="block" id="exBlock">
    <div class="block-title">Ejemplo</div>
    <div class="block-content" id="example"></div>
  </div>

  <div class="block" id="etymBlock">
    <div class="block-title">Etimología / Para memorizar</div>
    <div class="block-content" id="etym"></div>
  </div>

</div>

<div class="buttons">
  <button class="btn btn-red" onclick="rateWord('bad', event)">No la sé</button>
  <button class="btn btn-yellow" onclick="rateWord('review', event)">Repasar</button>
  <button class="btn btn-green" onclick="rateWord('easy', event)">La sé</button>
</div>

<div class="row">
  <div class="status" id="status">Inicializando…</div>
  <a class="link" id="raeLink" target="_blank" rel="noopener">Ver en RAE</a>
</div>

<script src="db.js"></script>
<script src="vocabEngine.js"></script>
<script src="srsEngine.js"></script>

<script>
let revealed = false;
let currentIndex = 0;
let sessionWords = [];
let currentWordData = null;

// Config de sesión
const SESSION_SIZE = 20;
const MIX_DUE_RATIO = 0.7; // 70% debidas, 30% nuevas

window.addEventListener("load", async function(){
  try{
    await initDB();
    await seedTestWordsIfEmpty();
    await startSession();
    document.getElementById("status").innerText = "Lista ✔ (toca la tarjeta)";
  }catch(e){
    console.error(e);
    document.getElementById("status").innerText = "Error inicializando ❌";
  }
});

async function startSession(){
  const ids = await getAllWordIds();
  if(!ids.length){
    setStatus("No hay palabras en base.");
    return;
  }

  // Clasificamos: NUEVAS (nunca repasadas), DEBIDAS (due<=hoy), FUTURAS
  const now = Date.now();
  const newIds = [];
  const dueIds = [];

  // Nota: con diccionario enorme optimizaremos esto; ahora es perfecto para validar flujo.
  for(const id of ids){
    const st = await SRS.getOrCreateProgress(id);
    const isNew = (st.reps === 0 && st.lapses === 0 && (st.interval === 0 || st.interval == null));
    if(isNew){
      newIds.push(id);
    } else if(st.due <= now){
      dueIds.push(id);
    }
  }

  shuffleInPlace(dueIds);
  shuffleInPlace(newIds);

  const dueTarget = Math.round(SESSION_SIZE * MIX_DUE_RATIO);
  const newTarget = SESSION_SIZE - dueTarget;

  const pick = [];

  // 1) Metemos debidas
  pick.push(...dueIds.slice(0, dueTarget));

  // 2) Metemos nuevas
  pick.push(...newIds.slice(0, newTarget));

  // 3) Si faltan, rellenamos con lo que haya
  if(pick.length < SESSION_SIZE){
    const remainDue = dueIds.slice(dueTarget);
    const remainNew = newIds.slice(newTarget);
    const filler = [...remainDue, ...remainNew];
    shuffleInPlace(filler);
    pick.push(...filler.slice(0, SESSION_SIZE - pick.length));
  }

  // Si aún así no llega (pocas palabras), nos quedamos con lo que hay.
  sessionWords = pick.slice(0, Math.min(SESSION_SIZE, pick.length));
  shuffleInPlace(sessionWords);

  currentIndex = 0;
  await loadCard();
}

async function loadCard(){
  revealed = false;

  if(currentIndex >= sessionWords.length){
    document.getElementById("definition").innerText = "Sesión terminada ✅";
    hideRevealBlocks();
    document.getElementById("word").style.display = "none";
    document.getElementById("raeLink").style.display = "none";
    updateProgress(true);
    setStatus("Sesión terminada. Vuelve a abrir para nueva tanda.");
    currentWordData = null;
    return;
  }

  const id = sessionWords[currentIndex];
  const w = await getWord(id);
  currentWordData = w;

  // FRONTAL: solo 1 acepción
  const first = (w?.senses && w.senses[0]) ? w.senses[0] : "Sin definición.";
  document.getElementById("definition").innerText = first;

  document.getElementById("word").style.display = "none";
  hideRevealBlocks();
  document.getElementById("raeLink").style.display = "none";

  updateProgress(false);
}

function revealAnswer(){
  if(revealed || !currentWordData) return;
  revealed = true;

  const w = currentWordData;

  // Palabra grande
  document.getElementById("word").innerText = w.word || "—";
  document.getElementById("word").style.display = "block";

  // Acepciones completas (incluida la primera)
  const senses = (w.senses || []);
  document.getElementById("senses").innerHTML =
    senses.length
      ? `<ol class="list">${senses.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ol>`
      : "—";
  document.getElementById("sensesBlock").style.display = "block";

  // Sinónimos
  const syn = (w.synonyms || []);
  document.getElementById("synonyms").innerText = syn.length ? syn.join(", ") : "—";
  document.getElementById("synBlock").style.display = "block";

  // Ejemplos
  const ex = (w.examples || []);
  document.getElementById("example").innerHTML =
    ex.length
      ? `<ul class="list">${ex.map(e=>`<li>${escapeHtml(e)}</li>`).join("")}</ul>`
      : "—";
  document.getElementById("exBlock").style.display = "block";

  // Etimología / Tip
  const et = w.etym || "—";
  const tip = w.tip ? `\n\n💡 ${w.tip}` : "";
  document.getElementById("etym").innerText = `${et}${tip}`;
  document.getElementById("etymBlock").style.display = "block";

  // Link RAE (no copiamos definiciones; solo consulta)
  const rae = document.getElementById("raeLink");
  const q = encodeURIComponent((w.word || "").trim());
  rae.href = `https://dle.rae.es/${q}`;
  rae.style.display = q ? "inline-block" : "none";
}

async function rateWord(gradeKey, ev){
  // Para que el click del botón no “revele” la tarjeta por bubbling
  if(ev) ev.stopPropagation();

  if(!currentWordData){
    return;
  }

  // Recomendación: obligar a revelar antes de calificar (aprendizaje activo)
  if(!revealed){
    setStatus("Primero intenta y toca la tarjeta para revelar 👆");
    return;
  }

  try{
    // SM-2: programamos próxima revisión
    await SRS.gradeWord(currentWordData.id, gradeKey);

    // Siguiente tarjeta
    currentIndex++;
    await loadCard();
    setStatus("Guardado ✔");
  }catch(e){
    console.error(e);
    setStatus("Error guardando ❌");
  }
}

function updateProgress(done){
  const total = sessionWords.length || SESSION_SIZE;
  const cur = Math.min(currentIndex + (done ? 0 : 1), total);
  const pct = total ? (cur / total) * 100 : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").innerText = `${cur} / ${total}`;
}

function hideRevealBlocks(){
  document.getElementById("sensesBlock").style.display = "none";
  document.getElementById("synBlock").style.display = "none";
  document.getElementById("exBlock").style.display = "none";
  document.getElementById("etymBlock").style.display = "none";
}

function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function shuffleInPlace(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}
</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
