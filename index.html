<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PasaPalabra PRO</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: radial-gradient(circle at top, #0b1630, #050b18 70%);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  margin-top: 40px;
  font-size: 34px;
  font-weight: 800;
}

h1 span {
  color: #f5c84c;
}

.card-container {
  width: 90%;
  max-width: 520px;
  margin-top: 40px;
}

.card {
  background: #111b2f;
  border-radius: 22px;
  padding: 28px;
  min-height: 260px;
  box-shadow: 0 0 40px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

button {
  border: none;
  padding: 12px 18px;
  border-radius: 14px;
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
}

.btn-start {
  background: #f5c84c;
  color: #000;
}

.btn-flip {
  background: #2c3e70;
  color: white;
}

.btn-next {
  background: #2e7d32;
  color: white;
}

.controls {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.status {
  margin-top: 16px;
  opacity: .7;
  font-size: 13px;
}
</style>
</head>

<body>

<h1><span>PasaPalabra</span> PRO</h1>

<div class="card-container">
  <div class="card">
    <div id="cardFront">Pulsa “Iniciar vocabulario”</div>
    <div id="cardBack" style="display:none;"></div>
  </div>

  <div class="controls">
    <button class="btn-start" onclick="startVocabSession()">Iniciar</button>
    <button class="btn-flip" onclick="flipCard()">Girar</button>
    <button class="btn-next" onclick="nextCard()">Siguiente</button>
  </div>

  <div id="status" class="status"></div>
</div>

<script src="js/db.js"></script>
<script src="js/srsEngine.js"></script>
<script src="js/vocabEngine.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
