<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>PasaPalabra PRO</title>
    <meta name="theme-color" content="#0b1326">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');

        :root {
            --bg1: #0c1426;
            --bg2: #060b18;
            --card-front: #121b32;
            --card-back: #0f172b;
            --gold: #f4c542;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.65);
            --btn-blue: #0e5ca8;
            --btn-red: #d32f2f;
            --btn-orange: #f57c00;
            --btn-green: #388e3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cabecera */
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        header h1 {
            color: var(--gold);
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        #status-bar {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Contenedor de la Tarjeta */
        .card-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            height: 60vh; /* Altura adaptable */
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            
            /* SOLUCIÓN AL CORTE EN EL MÓVIL */
            overflow-y: auto; 
        }

        .card-front {
            background: var(--card-front);
            border: 2px solid rgba(255, 255, 255, 0.05);
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-back {
            background: var(--card-back);
            border: 2px solid rgba(244, 197, 66, 0.3);
            transform: rotateY(180deg);
            align-items: flex-start;
        }

        /* Tipografía de la Tarjeta */
        .tip-text {
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: 700;
        }
        .word-title {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 5px;
            text-transform: capitalize;
        }
        .word-pos {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 3px 10px;
            border-radius: 10px;
        }
        .word-def {
            font-size: 1.1rem;
            line-height: 1.5;
            color: var(--text-main);
            text-align: left;
        }

        /* Zona de Botones */
        .controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            min-height: 100px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: scale(0.95);
        }

        .btn-main { background: var(--btn-blue); width: 100%; flex: none; }
        .btn-bad { background: var(--btn-red); display: none; }
        .btn-mid { background: var(--btn-orange); display: none; }
        .btn-good { background: var(--btn-green); display: none; }

    </style>
</head>
<body>

    <header>
        <h1>PASAPALABRA PRO</h1>
        <div id="status-bar">Iniciando base de datos...</div>
    </header>

    <div class="card-container">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <div class="tip-text" id="front-tip">Cargando...</div>
            </div>

            <div class="card-face card-back">
                <div class="word-title" id="back-word">Palabra</div>
                <div class="word-pos" id="back-pos">Categoría</div>
                <ul class="word-def" id="back-def">
                    <li>Definición aquí.</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-main" id="btn-flip">Girar Tarjeta</button>
        <button class="btn-bad" id="btn-bad">No la sé</button>
        <button class="btn-mid" id="btn-mid">Dudo</button>
        <button class="btn-good" id="btn-good">La sé</button>
    </div>

    <script src="db.js"></script>
    <script src="srsEngine.js"></script>
    <script src="vocabEngine.js"></script>

    <script>
        // ----------------------------------------------------
        // PUENTE ENTRE LA INTERFAZ HTML Y LA LÓGICA DEL JUEGO
        // ----------------------------------------------------

        // Elementos del DOM
        const card = document.getElementById('flashcard');
        const frontTip = document.getElementById('front-tip');
        const backWord = document.getElementById('back-word');
        const backPos = document.getElementById('back-pos');
        const backDef = document.getElementById('back-def');
        const statusBar = document.getElementById('status-bar');

        const btnFlip = document.getElementById('btn-flip');
        const btnBad = document.getElementById('btn-bad');
        const btnMid = document.getElementById('btn-mid');
        const btnGood = document.getElementById('btn-good');

        // Función global para actualizar la tarjeta desde vocabEngine.js
        window.renderFront = function(cardData) {
            frontTip.textContent = cardData.tip;
            backWord.textContent = cardData.word;
            backPos.textContent = cardData.pos;
            backDef.innerHTML = cardData.senses[0]; // Ya viene formateado en <li>
            
            // Asegurar que la tarjeta está boca abajo
            card.classList.remove('flipped');
            
            // Mostrar botón girar, ocultar botones de calificación
            btnFlip.style.display = 'block';
            btnBad.style.display = 'none';
            btnMid.style.display = 'none';
            btnGood.style.display = 'none';
        };

        // Girar la tarjeta (animación y cambio de botones)
        window.flipCard = function() {
            card.classList.add('flipped');
            
            btnFlip.style.display = 'none';
            btnBad.style.display = 'block';
            btnMid.style.display = 'block';
            btnGood.style.display = 'block';
        };

        // ----------------------------------------------------
        // INICIALIZACIÓN DE LA APP (ARRANQUE)
        // ----------------------------------------------------
        window.onload = async function() {
            try {
                // 1. Iniciar Base de datos (está en db.js)
                await window.initDB();
                
                // 2. Iniciar la sesión de juego (está en vocabEngine.js)
                if(typeof window.startVocabSession === "function") {
                    await window.startVocabSession();
                    statusBar.textContent = "¡A jugar! Tarjeta 1 de 20";
                }
            } catch (error) {
                console.error("Error arrancando la app:", error);
                statusBar.textContent = "Error al cargar la base de datos.";
            }
        };

    </script>
</body>
</html>
