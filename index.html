<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PasaPalabra PRO</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f1c">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#0b0f1c,#090c16);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin-top:30px;
  font-size:28px;
  font-weight:bold;
  background:linear-gradient(90deg,#f5c84c,#ffffff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.card{
  width:90%;
  max-width:520px;
  min-height:360px;
  margin-top:40px;
  background:#14192b;
  border-radius:20px;
  padding:30px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

#cardFront, #cardBack{
  min-height:250px;
}

.buttons{
  margin-top:30px;
  display:flex;
  gap:15px;
  justify-content:center;
}

button{
  padding:12px 20px;
  border-radius:12px;
  border:none;
  font-size:16px;
  cursor:pointer;
}

.primary{background:#1e88e5;color:white;}
.secondary{background:#444;color:white;}
.ok{background:#103a1c;color:#4cff8d;}
.fail{background:#3a1212;color:#ff5a5a;}

#status{
  margin-top:15px;
  opacity:.7;
  font-size:13px;
}
</style>
</head>

<body>

<h1>PasaPalabra PRO</h1>

<div class="card">
  <div id="cardFront"></div>
  <div id="cardBack" style="display:none;"></div>
</div>

<div class="buttons">
  <button class="primary" onclick="startVocabSession()">Iniciar vocabulario</button>
  <button class="secondary" onclick="flipCard()">Girar</button>
  <button class="secondary" onclick="nextCard()">Siguiente</button>
</div>

<div id="status">Listo.</div>

<script src="js/db.js"></script>
<script src="js/vocabEngine.js"></script>
<script src="js/srsEngine.js"></script>

<script>
async function init(){
  await initDB();
}
init();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
