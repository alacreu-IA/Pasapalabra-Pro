<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PasaPalabra PRO</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0f1c" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg,#0b0f1c,#090c16);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(90deg,#f5c84c,#ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      width: 90%;
      max-width: 500px;
      min-height: 300px;
      margin-top: 40px;
      background: #14192b;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
    }

    .definition {
      font-size: 20px;
      line-height: 1.6;
    }

    .word {
      font-size: 40px;
      font-weight: bold;
      color: #f5c84c;
      margin-bottom: 20px;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    button {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .fail { background: #3a1212; color: #ff5a5a; }
    .again { background: #3a3212; color: #f5c84c; }
    .ok { background: #103a1c; color: #4cff8d; }

    .loading {
      font-size: 18px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <h1>PasaPalabra PRO</h1>

  <div class="card" id="card">
    <div id="content" class="loading">Cargando...</div>
  </div>

  <div class="buttons">
    <button class="fail" onclick="rateCard(0)">No la sé</button>
    <button class="again" onclick="rateCard(1)">Repasar</button>
    <button class="ok" onclick="rateCard(2)">La sé</button>
  </div>

  <!-- 🔥 IMPORTANTE: RUTAS CORRECTAS -->
  <script src="js/db.js"></script>
  <script src="js/vocabEngine.js"></script>
  <script src="js/srsEngine.js"></script>

  <script>
    let currentCard = null;
    let showingAnswer = false;

    async function initApp() {
      try {
        await initDB();
        currentCard = await getNextCard();
        renderFront();
      } catch (err) {
        document.getElementById("content").innerHTML =
          "Error cargando base de datos.";
        console.error(err);
      }
    }

    function renderFront() {
      showingAnswer = false;
      const content = document.getElementById("content");
      content.classList.remove("loading");

      content.innerHTML = `
        <div class="definition">
          ${currentCard.definition}
        </div>
      `;
    }

    function renderBack() {
      if (showingAnswer) return;
      showingAnswer = true;

      const content = document.getElementById("content");

      content.innerHTML = `
        <div class="word">${currentCard.word}</div>
        <div class="definition">
          ${currentCard.fullDefinition}
        </div>
      `;
    }

    document.getElementById("card").addEventListener("click", renderBack);

    async function rateCard(score) {
      if (!currentCard) return;

      await updateCardScore(currentCard.id, score);
      currentCard = await getNextCard();
      renderFront();
    }

    initApp();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>

</body>
</html>
