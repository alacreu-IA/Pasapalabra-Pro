<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PasaPalabra PRO</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f111a">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f111a;
  --card:#171923;
  --card2:#1f2230;
  --border:#2a2d3c;
  --text:#f0f0f5;
  --text2:#8e92a7;
  --gold:#f5c842;
  --green:#3ecf72;
  --red:#ff5555;
  --blue:#4a9eff;
  --purple:#a78bfa;
  --r:18px;
}

body{
  margin:0;
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* PROGRESO */
.header{
  width:100%;
  max-width:420px;
  padding:18px 20px 0;
}

.progress-bar{
  height:6px;
  background:var(--card2);
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:var(--gold);
  transition:.3s;
}

.progress-text{
  font-size:11px;
  color:var(--text2);
  margin-top:6px;
  font-family:'Syne',sans-serif;
}

/* TARJETA */
.card{
  width:92%;
  max-width:420px;
  height:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:22px;
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow:hidden;
  cursor:pointer;
}

.meta{
  font-size:11px;
  font-family:'Syne',sans-serif;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.meta.adj{color:var(--gold);}
.meta.sust{color:var(--blue);}
.meta.verb{color:var(--green);}
.meta.adv{color:var(--purple);}
.meta.other{color:var(--text2);}

.definition{
  font-size:18px;
  line-height:1.6;
}

.revealed-layout{
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:14px;
}

.word{
  font-family:'Syne',sans-serif;
  font-size:28px;
  font-weight:800;
  color:var(--gold);
}

.pos{
  font-size:11px;
  text-transform:uppercase;
  color:var(--text2);
}

.compact-block{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  font-size:13px;
  line-height:1.4;
}

/* BOTONES */
.buttons{
  width:92%;
  max-width:420px;
  display:flex;
  gap:8px;
  margin:20px 0 10px;
}

.btn{
  flex:1;
  border:none;
  border-radius:14px;
  padding:12px 6px;
  font-family:'Syne',sans-serif;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.btn-red{background:rgba(255,85,85,0.15);color:var(--red);border:1px solid rgba(255,85,85,0.4);}
.btn-yellow{background:rgba(245,200,66,0.15);color:var(--gold);border:1px solid rgba(245,200,66,0.4);}
.btn-green{background:rgba(62,207,114,0.15);color:var(--green);border:1px solid rgba(62,207,114,0.4);}

.row{
  width:92%;
  max-width:420px;
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
}

.link{
  font-size:11px;
  color:var(--text2);
  text-decoration:none;
  border:1px solid var(--border);
  padding:8px 10px;
  border-radius:12px;
  display:none;
}

.status{ font-size:11px; color:var(--text2); }
</style>
</head>

<body>

<div class="header">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText">0 / 20</div>
</div>

<div class="card" onclick="revealAnswer()">
  Cargando...
</div>

<div class="buttons">
  <button class="btn btn-red" onclick="rateWord('bad', event)">No la sé</button>
  <button class="btn btn-yellow" onclick="rateWord('review', event)">Repasar</button>
  <button class="btn btn-green" onclick="rateWord('easy', event)">La sé</button>
</div>

<div class="row">
  <div class="status" id="status">Inicializando…</div>
  <a class="link" id="raeLink" target="_blank">Ver en RAE</a>
</div>

<script src="db.js"></script>
<script src="vocabEngine.js"></script>
<script src="srsEngine.js"></script>

<script>
let revealed=false;
let currentIndex=0;
let sessionWords=[];
let currentWordData=null;
const SESSION_SIZE=20;

window.addEventListener("load", async function(){
  await initDB();
  await seedTestWordsIfEmpty();
  await startSession();
});

async function startSession(){
  const ids=await getAllWordIds();
  sessionWords=ids.sort(()=>Math.random()-0.5).slice(0,SESSION_SIZE);
  currentIndex=0;
  await loadCard();
}

function getPosClass(pos){
  if(!pos) return "other";
  pos=pos.toLowerCase();
  if(pos.includes("adj")) return "adj";
  if(pos.includes("sust")||pos.includes("m.")||pos.includes("f.")) return "sust";
  if(pos.includes("verb")) return "verb";
  if(pos.includes("adv")) return "adv";
  return "other";
}

async function loadCard(){
  revealed=false;

  if(currentIndex>=sessionWords.length){
    document.querySelector(".card").innerHTML="Sesión terminada ✅";
    return;
  }

  const id=sessionWords[currentIndex];
  const w=await getWord(id);
  currentWordData=w;

  const first=w.senses?.[0]||"Sin definición.";
  const posClass=getPosClass(w.pos);

  document.querySelector(".card").innerHTML=`
    <div class="meta ${posClass}">
      ${escapeHtml(w.pos||"")}
      ${w.field?" · "+escapeHtml(w.field):""}
    </div>
    <div class="definition">${escapeHtml(first)}</div>
  `;

  updateProgress();
}

function revealAnswer(){
  if(revealed||!currentWordData)return;
  revealed=true;

  const w=currentWordData;

  document.querySelector(".card").innerHTML=`
    <div class="revealed-layout">
      <div class="word">${escapeHtml(w.word)}</div>
      <div class="pos">${escapeHtml(w.pos||"")} ${w.field?" · "+escapeHtml(w.field):""}</div>

      <div class="compact-block">
        ${(w.senses||[]).map((s,i)=>`${i+1}. ${escapeHtml(s)}`).join("<br><br>")}
      </div>

      <div class="compact-block">
        📜 ${escapeHtml(w.etym||"—")}
        ${w.tip?`<br><br>💡 ${escapeHtml(w.tip)}`:""}
      </div>
    </div>
  `;

  const rae=document.getElementById("raeLink");
  rae.href=`https://dle.rae.es/${encodeURIComponent(w.word)}`;
  rae.style.display="inline-block";
}

async function rateWord(type,e){
  e.stopPropagation();
  if(!revealed)return;

  await SRS.gradeWord(currentWordData.id,type);
  currentIndex++;
  await loadCard();
}

function updateProgress(){
  const pct=((currentIndex+1)/SESSION_SIZE)*100;
  document.getElementById("progressFill").style.width=pct+"%";
  document.getElementById("progressText").innerText=`${currentIndex+1} / ${SESSION_SIZE}`;
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}
</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
