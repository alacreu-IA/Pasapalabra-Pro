<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PasaPalabra PRO</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      margin-top: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>PasaPalabra PRO</h1>
    <p>Base estructural instalada correctamente</p>
    <button onclick="testDB()">Probar base de datos</button>
    <div class="status" id="status">Inicializando...</div>
  </div>

  <!-- Base de datos -->
  <script src="db.js"></script>

  <script>
    // Inicializar base de datos al cargar
    window.addEventListener("load", async function () {
      try {
        await initDB();
        document.getElementById("status").innerText = "Base de datos lista ✔";
      } catch (error) {
        document.getElementById("status").innerText = "Error en base de datos ❌";
        console.error(error);
      }
    });

    function testDB() {
      alert("IndexedDB funcionando correctamente");
    }
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .then(function () {
            console.log("Service Worker registrado correctamente");
          })
          .catch(function (error) {
            console.error("Error registrando el Service Worker:", error);
          });
      });
    }
  </script>

</body>
</html>
